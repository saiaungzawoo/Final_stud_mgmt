<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/css :: css}"></head>

<body class="bg-light">

<div th:replace="~{layout/admin-layout :: layout(~{::section})}">
   





       



        <!-- MAIN CONTENT -->
       


            <section class="section-pad">


                <div class="container-xxl">



                    <!-- PAGE HEADER -->

                    <div class="mb-4">

                        <h2 class="fw-bold">
                            Payment Management
                        </h2>

                        <p class="text-muted mb-0">
                            View payment records and monitor student payment status.
                        </p>

                    </div>




                    <!-- STATISTICS CARDS -->

                    <div class="row g-4 mb-4">


                        <!-- Collected Amount -->

                        <div class="col-md-4">

                            <div class="card border-0 shadow-sm h-100">

                                <div class="card-body">


                                    <div class="d-flex align-items-center">


                                        <div class="bg-success bg-opacity-10 rounded p-3 me-3">

                                            <i class="bi bi-cash-stack text-success fs-2"></i>

                                        </div>


                                        <div>

                                            <p class="text-muted mb-1">
                                                Collected Amount
                                            </p>


                                            <h3 class="fw-bold mb-0"
                                                th:text="${'MMK ' + #numbers.formatDecimal(stats.collectedAmount, 1, 'COMMA', 2, 'POINT')}">
                                            </h3>

                                        </div>


                                    </div>


                                </div>

                            </div>


                        </div>




                        <!-- Outstanding Amount -->

                        <div class="col-md-4">

                            <div class="card border-0 shadow-sm h-100">


                                <div class="card-body">


                                    <div class="d-flex align-items-center">


                                        <div class="bg-warning bg-opacity-10 rounded p-3 me-3">

                                            <i class="bi bi-hourglass-split text-warning fs-2"></i>

                                        </div>


                                        <div>

                                            <p class="text-muted mb-1">
                                                Outstanding Amount
                                            </p>


                                            <h3 class="fw-bold mb-0"
                                                th:text="${'MMK ' + #numbers.formatDecimal(stats.outstandingAmount, 1, 'COMMA', 2, 'POINT')}">
                                            </h3>


                                        </div>


                                    </div>


                                </div>


                            </div>


                        </div>




                        <!-- Pending Payment -->

                        <div class="col-md-4">


                            <div class="card border-0 shadow-sm h-100">


                                <div class="card-body">


                                    <div class="d-flex align-items-center">


                                        <div class="bg-primary bg-opacity-10 rounded p-3 me-3">

                                            <i class="bi bi-clock-history text-primary fs-2"></i>

                                        </div>


                                        <div>

                                            <p class="text-muted mb-1">
                                                Pending Payment
                                            </p>


                                            <h3 class="fw-bold mb-0"
                                                th:text="${stats.pendingPayment}">
                                                0
                                            </h3>


                                        </div>


                                    </div>


                                </div>


                            </div>


                        </div>



                    </div>





                    <!-- PAYMENT LIST CARD -->


                    <div class="card border-0 shadow-sm">


                        <div class="card-body">



                            <div class="d-flex justify-content-between align-items-center mb-4">


                                <h4 class="fw-bold mb-0">
                                    Payment List
                                </h4>


                                <!-- Search later -->

                                <div class="input-group w-auto">

                                    <input type="text"
                                           class="form-control"
                                           placeholder="Search payment">


                                    <button class="btn btn-primary">

                                        <i class="bi bi-search"></i>

                                    </button>


                                </div>



                            </div>





                            <div class="table-responsive">


                                <table class="table table-hover align-middle">


                                    <thead class="table-light">


                                        <tr>

                                            <th>
                                                Transaction ID
                                            </th>


                                            <th>
                                                Student
                                            </th>


                                            <th>
                                                Course
                                            </th>


                                            <th>
                                                Payment Type
                                            </th>
                                            
                                             <th>
                                                Payment Method
                                            </th>


                                            <th>
                                                Amount
                                            </th>


                                            <th>
                                                Status
                                            </th>


                                            <th>
                                                Date
                                            </th>


                                            <th>
                                                Action
                                            </th>


                                        </tr>


                                    </thead>




                                    <tbody>


                                        <tr th:each="payment : ${payments}">


                                            <td th:text="${payment.transactionReference}">
                                                TXN
                                            </td>


                                            <td th:text="${payment.studentName}">
                                                Student
                                            </td>


                                            <td th:text="${payment.courseName}">
                                                Course
                                            </td>


                                            <td>

                                                <span class="badge bg-primary"
                                                      th:text="${payment.paymentTypeName}">
                                                    Payment
                                                </span>

                                            </td>
                                            
                                            <td th:text="${payment.paymentMethodName}">Method</td>


                                            <td th:text="${payment.amount} + ' MMK'">
                                                0 MMK
                                            </td>


                                            <td>

                                                <span class="badge bg-success"
                                                      th:text="${payment.status}">
                                                    Success
                                                </span>


                                            </td>


                                            <td th:text="${payment.paymentDate}">
                                                Date
                                            </td>


                                            <td>


                                                <a th:href="@{/admin/payment/detail/{id}(id=${payment.paymentId})}"
                                                   class="btn btn-sm btn-outline-primary">

                                                    View

                                                </a>


                                            </td>


                                        </tr>





                                    </tbody>


                                </table>


                            </div>




                        </div>


                    </div>






                </div>


            </section>
            </div>



      


    


</body>

</html>
