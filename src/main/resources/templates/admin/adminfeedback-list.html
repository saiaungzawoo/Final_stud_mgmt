<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Management</title>

    <th:block th:replace="~{fragment/css :: css}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="bg-light">

    <!-- Header -->
    <div th:replace="~{fragment/admin-header :: adminHeader}"></div>

    <!-- Layout -->
    <div class="admin-layout">

        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div th:replace="~{fragment/admin-sidebar :: adminSidebar}"></div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">

            <div class="container-fluid">

                <!-- Page Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">
                            <i class="bi bi-chat-left-text-fill text-primary me-2"></i>
                            Student Feedback List
                        </h3>
                        <p class="text-muted mb-0">
                            View and manage student course feedback
                        </p>
                    </div>
                </div>

                <!-- Card -->
                <div class="card shadow-sm border-0 rounded-4">

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead class="table-primary text-center">
                                    <tr>
                                        <th>No</th>
                                        <th>Student</th>
                                        <th>Course</th>
                                        <th>Rating</th>
                                        <th>Comment</th>
                                        <th>Anonymous</th>
                                        <th>Date</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>

                                <tbody>

                                    <tr th:each="feedback, stat : ${feedbackList}">

                                        <td class="text-center"
                                            th:text="${stat.count}"></td>

                                        <td>
                                            <span th:if="${feedback.isAnonymous == 1}"
                                                class="badge bg-secondary">
                                                Anonymous
                                            </span>

                                            <span th:unless="${feedback.isAnonymous == 1}"
                                                th:text="${feedback.userName}">
                                            </span>
                                        </td>

                                        <td th:text="${feedback.courseName}"></td>

                                        <td class="text-center text-nowrap">
                                            <span th:each="i : ${#numbers.sequence(1,5)}">
                                                <i class="bi"
                                                   th:classappend="${i <= feedback.rating} ?
                                                   'bi-star-fill text-warning' :
                                                   'bi-star text-secondary'">
                                                </i>
                                            </span>
                                        </td>

                                       <td>
    <span class="comment-col"
          th:text="${feedback.comment}"
          th:title="${feedback.comment}">
    </span>
</td>

                                        <td class="text-center">
                                            <span
                                                th:class="${feedback.isAnonymous == 1}
                                                ? 'badge bg-success'
                                                : 'badge bg-primary'"

                                                th:text="${feedback.isAnonymous == 1}
                                                ? 'Yes'
                                                : 'No'">
                                            </span>
                                        </td>

                                        <td class="text-center text-nowrap"
                                            th:text="${#dates.format(feedback.createdAt,'dd/MM/yyyy')}">
                                        </td>

                                        <td class="text-center">

                                            <a th:href="@{/student/feedback/delete/{id}(id=${feedback.feedbackID})}"
                                               class="btn btn-danger btn-sm"
                                               onclick="return confirm('Delete this feedback?')">

                                                <i class="bi bi-trash"></i>

                                            </a>

                                        </td>

                                    </tr>

                                    <tr th:if="${#lists.isEmpty(feedbackList)}">

                                        <td colspan="8"
                                            class="text-center py-5 text-muted">

                                            No feedback found.

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Footer -->
    <div th:replace="~{fragment/footer :: footer}"></div>

    <div th:replace="~{fragment/js :: js}"></div>

</body>

</html>
