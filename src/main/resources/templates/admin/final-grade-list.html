<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
    <th:block th:replace="~{fragment/css :: css}"></th:block>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div th:replace="~{fragment/admin-header :: adminHeader}"></div>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragment/admin-sidebar :: adminSidebar}"></div>
        </div>

        <!-- Main -->
        <main class="col-md-9 col-lg-10 p-4 bg-light min-vh-100">

    <h2 class="fw-bold mb-3 text-dark">
        <i class="bi bi-award-fill text-primary"></i>
        Final Grade Management
    </h2>


    <!-- Course List -->

    <div class="card shadow-sm border-0 rounded-4 mb-4">

        <div class="card-header bg-white border-0 pt-4 px-4">
            <h5 class="fw-bold mb-0">
                Course List
            </h5>
        </div>


        <div class="card-body px-4">

            <table class="table align-middle table-hover">

                <thead>

                <tr class="text-secondary small">

                    <th>NO</th>
                    <th>COURSE</th>
                    <th>TEACHER</th>
                    <th>ACTION</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="course,stat : ${courseList}">

                    <td th:text="${stat.count}"></td>

                    <td class="fw-semibold"
                        th:text="${course.courseName}">
                    </td>


                    <td th:text="${course.teacherName}">
                    </td>


                    <td>

                        <a class="btn btn-primary rounded-pill px-3 btn-sm"
                           th:href="@{/admin/final-grade(courseId=${course.courseID})}">

                            <i class="bi bi-eye"></i>
                            View Grades

                        </a>

                    </td>

                </tr>

                </tbody>


            </table>

        </div>

    </div>




    <!-- Final Grade List -->


    <div class="card shadow-sm border-0 rounded-4"
         th:if="${gradeList != null}">


        <div class="card-header bg-white border-0 pt-4 px-4">

            <h5 class="fw-bold mb-0">
                Student Final Grades
            </h5>

        </div>


        <div class="card-body px-4">


            <table class="table align-middle table-hover">


                <thead>

                <tr class="text-secondary small">

                    <th>NO</th>
                    <th>STUDENT</th>
                    <th>COURSE</th>
                    <th>SCORE</th>
                    <th>GRADE</th>
                    <th>STATUS</th>
                    <th>FINALIZED DATE</th>


                </tr>

                </thead>



                <tbody>


                <tr th:each="grade,stat:${gradeList}">


                    <td th:text="${stat.count}"></td>


                    <td class="fw-semibold"
                        th:text="${grade.studentName}">
                    </td>


                    <td th:text="${grade.courseName}">
                    </td>


                    <td>

                        <span class="fw-bold text-primary"
                              th:text="${grade.finalScore}">
                        </span>

                    </td>


                    <td>

                        <span class="badge rounded-pill bg-primary px-3"
                              th:text="${grade.letterGrade}">
                        </span>

                    </td>



                    <td>


                        <span class="badge rounded-pill bg-success px-3"
                              th:if="${grade.status=='Completed'}">

                            <i class="bi bi-check-circle"></i>
                            Completed

                        </span>



                        <span class="badge rounded-pill bg-danger px-3"
                              th:if="${grade.status=='Failed'}">

                            Failed

                        </span>


                    </td>



                    <td>
                        <span th:if="${grade.finalizedAt != null}"
                              th:text="${#temporals.format(grade.finalizedAt,'yyyy-MM-dd HH:mm')}">
                        </span>

                        <span th:if="${grade.finalizedAt == null}"
                              class="text-muted">
                            Not finalized
                        </span>
                    </td>


                </tr>


                </tbody>


            </table>


        </div>

    </div>


</main>
    </div>

</div>

<div th:replace="~{fragment/footer :: footer}"></div>
<div th:replace="~{fragment/js :: js}"></div>

</body>
</html>
