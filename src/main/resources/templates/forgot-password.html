<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Forgot Password</title>
    <th:block th:replace="~{fragment/css :: css}"></th:block>

    <!-- Custom UI Styling -->
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .auth-card {
            border: none;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            transition: all 0.3s ease;
        }

        .auth-header-icon {
            width: 60px;
            height: 60px;
            background: #e0e7ff;
            color: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 24px;
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.875rem;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            font-size: 0.95rem;
            color: #1e293b;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        .btn-primary-custom {
            background-color: #4f46e5;
            border: none;
            border-radius: 12px;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .back-link {
            color: #6366f1;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #4338ca;
            text-decoration: underline !important;
        }

        .alert {
            border-radius: 12px;
            border: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div th:replace="~{fragment/header :: header}"></div>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card auth-card p-4 p-md-5">

                    <!-- Title Header -->
                    <div class="text-center mb-4">
                        <div class="auth-header-icon">
                            🔑
                        </div>
                        <h4 class="fw-bold text-dark mb-1">Forgot Password?</h4>
                        <p class="text-muted small mb-0">Enter your registered email to receive a verification OTP code.</p>
                    </div>

                    <div class="card-body p-0">
                        <!-- Error Message -->
                        <div th:if="${error}" 
                             class="alert alert-danger alert-dismissible fade show mb-3" 
                             role="alert">
                            <span th:text="${error}"></span>
                        </div>
<form th:action="@{/forgot-password/send-otp}" method="post">
                            <div class="mb-4">
                                <label class="form-label">Email Address</label>
                                <input type="email" 
                                       name="email" 
                                       class="form-control" 
                                       placeholder="name@example.com" 
                                       autocomplete="email"
                                       required 
                                       autofocus>
                            </div>

                            <button type="submit" class="btn btn-primary-custom text-white w-100">
                                Send OTP Code
                            </button>
                        </form>

                        <hr class="my-4 text-muted opacity-25">

                        <div class="text-center">
                            <a th:href="@{/login}" class="back-link text-decoration-none d-inline-flex align-items-center gap-1">
                                <span>←</span> Back to Login
                            </a>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{fragment/footer :: footer}"></div>

</body>

</html>
