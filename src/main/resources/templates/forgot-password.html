<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
    <th:block th:replace="~{fragment/css :: css}"></th:block>
</head>
<body>

<div th:replace="~{fragment/header :: header}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header text-center">
                    <h3>Forgot Password</h3>
                </div>
                <div class="card-body">

                    <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                    <form th:if="${showOtpForm == null}" th:action="@{/forgot-password/send-otp}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" th:value="${email}" required placeholder="Enter your registered email">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send OTP Code</button>
                    </form>

                    <form th:if="${showOtpForm}" th:action="@{/forgot-password/reset}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" th:value="${email}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Enter 6-Digit OTP</label>
                            <input type="text" name="otp" class="form-control" required placeholder="Enter OTP code" maxlength="6">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" name="newPassword" class="form-control" required placeholder="Enter new password">
                        </div>

                        <button type="submit" class="btn btn-success w-100">Verify & Reset Password</button>
                    </form>

                    <hr>
                    <div class="text-center">
                        <a th:href="@{/login}" class="text-decoration-none">Back to Login</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragment/footer :: footer}"></div>

</body>
</html>
