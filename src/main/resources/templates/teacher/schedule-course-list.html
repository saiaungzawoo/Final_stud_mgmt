<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragment/css :: css}"></th:block>
    <link rel="stylesheet" th:href="@{/css/teacher.css}">
</head>
<body>

<div th:replace="~{teacher/teacher-dashboard :: teacherHeader}"></div>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{teacher/teacher-dashboard :: sidebar}"></div>
        </div>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 p-4 bg-light min-vh-100">

   <input type="text"
           id="courseSearch"
           class="form-control"
           placeholder="Search Course...">
            
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h2 class="fw-bold">Schedule</h2>
                    <p class="text-muted mb-0">
                        Select a course to generate or update its schedule.
                    </p>
                </div>

            </div>
            
          

            <div class="row g-4">

               <div class="col-12 col-md-6 col-lg-4"
                     th:each="course : ${courseList}">

                    <a class="category-card"
                       th:href="@{/schedule/generate/{courseID}(courseID=${course.courseId})}">

                        <i class="bi bi-calendar-event text-primary"></i>

                      <h3 class="course-name"
   							 th:text="${course.name}">
						</h3>

                        <p class="course-description"
				   th:text="${course.description}">
				</p>

                    </a>

                </div>

            </div>

        </main>

    </div>

</div>

<div th:replace="~{fragment/footer :: footer}"></div>

<div th:replace="~{fragment/js :: js}"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const searchInput = document.getElementById("courseSearch");

    searchInput.addEventListener("keyup", function () {

        const keyword = this.value.toLowerCase();

        const cards = document.querySelectorAll(".col-12.col-md-6.col-lg-4");

        cards.forEach(card => {

            const courseName = card.querySelector(".course-name")
                                   .textContent
                                   .toLowerCase();

            if (courseName.includes(keyword)) {
                card.style.display = "";
            } else {
                card.style.display = "none";
            }

        });

    });

});
</script>
</body>

</html>
