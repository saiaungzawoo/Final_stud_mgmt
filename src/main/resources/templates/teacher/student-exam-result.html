<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head th:replace="~{fragment/css :: css}">
</head>


<body>


<div th:replace="~{teacher/teacher-dashboard :: teacherHeader}">
</div>



<div class="container-fluid">


<div class="row">


<div class="col-md-3 col-lg-2 p-0">

<div th:replace="~{teacher/teacher-dashboard :: sidebar}">
</div>

</div>




<main class="col-md-9 col-lg-10 p-4">

၊
<h3 class="mb-4">
    Student Exam Results
</h3>

 <a th:href="@{/attendance/students}"
                   class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-left"></i>
                    Back

                </a>


<div class="card">


<div class="card-body">


<table class="table table-bordered">


<thead>

<tr>

<th>No</th>

<th>Course</th>

<th>Exam</th>

<th>Type</th>

<th>Score</th>

<th>Remarks</th>

<th>Date</th>

</tr>

</thead>



<tbody>


<tr th:each="result,stat:${examResultList}">


<td th:text="${stat.count}">
</td>


<td th:text="${result.courseName}">
</td>


<td th:text="${result.examName}">
</td>


<td th:text="${result.examType}">
</td>



<td>

<span th:text="${result.score}">
</span>

/

<span th:text="${result.maxScore}">
</span>

</td>



<td th:text="${result.remarks}">
</td>



<td th:text="${result.gradedAt}">
</td>



</tr>



<tr th:if="${#lists.isEmpty(examResultList)}">

<td colspan="7"
    class="text-center">

No Exam Result Found

</td>

</tr>


</tbody>


</table>


</div>


</div>


</main>


</div>


</div>


<div th:replace="~{fragment/footer :: footer}">
</div>


<div th:replace="~{fragment/js :: js}">
</div>


</body>

</html>
