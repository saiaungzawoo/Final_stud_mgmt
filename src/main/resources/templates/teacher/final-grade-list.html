<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragment/css :: css}"></th:block>
    <link rel="stylesheet" th:href="@{/css/teacher.css}">
</head>


<body>


<!-- Header -->
<div th:replace="~{teacher/teacher-dashboard :: teacherHeader}"></div>



<div class="container-fluid">

    <div class="row">


        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 p-0">

            <div th:replace="~{teacher/teacher-dashboard :: sidebar}"></div>

        </div>





        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 p-4 bg-light min-vh-100">


            <div class="mb-4">

                <h2 class="fw-bold">
                    Final Grade List
                </h2>

                <p class="text-muted">
                    View completed student final grades.
                </p>

            </div>





            <div class="card shadow-sm border-0">


                <div class="card-body">


                    <div class="table-responsive">


                        <table class="table table-hover align-middle">


                            <thead class="table-dark">

                                <tr>

                                    <th>No</th>

                                    <th>Student</th>

                                    <th>Course</th>

                                    <th>Assignment</th>

                                    <th>Exam</th>

                                    <th>Attendance</th>

                                    <th>Final Score</th>

                                    <th>Grade</th>

                                    <th>Status</th>

                                    <th>Action</th>

                                </tr>


                            </thead>





                            <tbody>


                                <!-- Sample Data -->

                       
<tr th:each="grade, stat : ${finalGradeList}">

    <td th:text="${stat.count}"></td>

    <td th:text="${grade.studentName}"></td>

    <td th:text="${grade.courseName}"></td>

    <td th:text="${grade.assignmentTotalScore}"></td>

    <td th:text="${grade.examTotalScore}"></td>

    <td th:text="${grade.attendanceScore}"></td>

    <td th:text="${grade.finalScore}"></td>

    <td th:text="${grade.letterGrade}"></td>

    <td>
        <span th:text="${grade.status}"
              class="badge bg-success">
        </span>
    </td>

    <td>
        <button class="btn btn-primary btn-sm">
            View
        </button>
    </td>

</tr>


                            </tbody>



                        </table>



                    </div>



                </div>



            </div>





        </main>



    </div>


</div>





<!-- Footer -->

<div th:replace="~{fragment/footer :: footer}"></div>




<div th:replace="~{fragment/js :: js}"></div>



</body>

</html>
