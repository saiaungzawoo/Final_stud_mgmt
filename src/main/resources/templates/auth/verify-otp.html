<script th:inline="javascript">

    // OTP Expire Time
    let expireTime = /*[[${expireTime}]]*/ 0;

    const timerElement = document.getElementById("timer");
    const verifyBtn = document.getElementById("verifyBtn");
    const resendForm = document.getElementById("resendForm");

    let interval = setInterval(updateTimer, 1000);
    updateTimer();

    function updateTimer() {

        const now = new Date().getTime();
        const distance = expireTime - now;

        if (distance <= 0) {

            clearInterval(interval);

            timerElement.innerHTML = "Expired";

            verifyBtn.style.display = "none";
            resendForm.style.display = "block";

            return;
        }

        let minutes = Math.floor(distance / 1000 / 60);
        let seconds = Math.floor((distance / 1000) % 60);

        minutes = String(minutes).padStart(2, '0');
        seconds = String(seconds).padStart(2, '0');

        timerElement.innerHTML = minutes + ":" + seconds;
    }

    // OTP Validation
    function validateOtp() {

        let otp = document.getElementById("otp").value.trim();
        let error = document.getElementById("otpError");

        error.style.display = "none";

        if (otp === "") {
            error.innerHTML = "Please enter OTP.";
            error.style.display = "block";
            return false;
        }

        // Only Number
        if (!/^[0-9]+$/.test(otp)) {
            error.innerHTML = "Only numbers are allowed.";
            error.style.display = "block";
            return false;
        }

        // Only 6 Digits
        if (otp.length !== 6) {
            error.innerHTML = "Only 6 numbers are allowed.";
            error.style.display = "block";
            return false;
        }

        return true;
    }

    // ရိုက်နေတုန်း Error Message ပဲဖျောက်မယ်
    document.getElementById("otp").addEventListener("input", function () {

        document.getElementById("otpError").style.display = "none";

    });

</script>
