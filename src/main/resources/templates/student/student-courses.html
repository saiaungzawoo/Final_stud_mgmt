<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/css :: css}"></head>

<body class="bg-light">

	<!-- HEADER -->
	<div th:replace="~{fragment/student-header :: studentHeader}"></div>

	<div class="d-flex">

		<!-- SIDEBAR -->
		<div th:replace="~{fragment/student-sidebar :: studentSidebar}"></div>

		<!-- MAIN CONTENT -->
		<main class="flex-grow-1 bg-light">

			<section class="section-pad">

				<div class="container-fluid">

					<!-- Page Heading -->
					<div class="mb-4">
						<h2 class="fw-bold">My Courses</h2>

						<p class="text-muted mb-0">View all of the courses you're
							currently enrolled in.</p>

						<form th:action="@{/student/courses}" method="get"
							class="row g-3 mt-4 mb-4">


							<!-- SEARCH -->

							<div class="col-lg-6">

								<input type="text" class="form-control" name="keyword"
									placeholder="Search my courses..." th:value="${keyword}">

							</div>



							<!-- CATEGORY FILTER -->

							<div class="col-lg-4">

								<select class="form-select" name="categoryId">


									<option value="">All Categories</option>


									<option th:each="category : ${categories}"
										th:value="${category.CourseCategoryId}"
										th:text="${category.name}"
										th:selected="${category.CourseCategoryId == selectedCategory}">
									</option>


								</select>


							</div>



							<div class="col-lg-2">

								<button class="btn btn-primary w-100">

									<i class="bi bi-search"></i> Search

								</button>

							</div>


						</form>
					</div>

					<!-- Course List -->
					<div class="row g-4">

						<div class="col-lg-6" th:each="course : ${courses}">

							<div class="card border-0 shadow-sm h-100">

								<div class="card-body">

									<div class="d-flex">

										<!-- Placeholder -->
										<div
											class="bg-primary bg-opacity-10 rounded d-flex align-items-center justify-content-center me-4"
											style="width: 90px; height: 90px;">

											<i
												class="bi bi-journal-bookmark-fill
                                                      text-primary fs-1">
											</i>

										</div>

										<!-- Course Info -->
										<div class="flex-grow-1">

											<h4 class="fw-bold mb-2" th:text="${course.name}"></h4>

											<p class="text-muted mb-2">

												<i class="bi bi-person-fill me-1"></i> <span
													th:text="${course.teacherName}"> </span>

											</p>

											<div class="row small text-muted">

												<div class="col-6 mb-2">

													<i class="bi bi-tag-fill me-1"></i> <span
														th:text="${course.categoryName}"> </span>

												</div>

												<div class="col-6 mb-2">

													<i class="bi bi-bar-chart-fill me-1"></i> <span
														th:text="${course.level}"> </span>

												</div>

												<div class="col-6">

													<i class="bi bi-clock-fill me-1"></i> <span
														th:text="${course.durationWeeks + ' Weeks'}"> </span>

												</div>

											</div>

										</div>

									</div>

									<hr>

									<div class="text-end">

										<a class="btn btn-primary"
											th:href="@{/student/course/{id}(id=${course.CourseId})}">

											View Course </a>

									</div>

								</div>

							</div>

						</div>

					</div>

					<!-- Empty State -->
					<!-- SEARCH RESULT EMPTY STATE -->
					<div
						th:if="${#lists.isEmpty(courses) 
             and (keyword != null 
             or selectedCategory != null)}"
						class="text-center py-5">


						<i class="bi bi-search display-2 text-secondary"></i>


						<h3 class="mt-4">No courses found</h3>


						<p class="text-muted">Try changing your search keyword or
							category filter.</p>


					</div>



					<!-- NO ENROLLED COURSE EMPTY STATE -->
					<div
						th:if="${#lists.isEmpty(courses) 
             and keyword == null 
             and selectedCategory == null}"
						class="text-center py-5">


						<i class="bi bi-journal-x display-2 text-secondary"></i>


						<h3 class="mt-4">No enrolled courses</h3>


						<p class="text-muted">You haven't enrolled in any courses yet.
						</p>


						<a th:href="@{/courses/show}" class="btn btn-primary mt-2">

							Browse Courses </a>


					</div>

				</div>

			</section>

		</main>

	</div>

	<div th:replace="~{fragment/footer :: footer}"></div>
	<div th:replace="~{fragment/js :: js}"></div>

</body>
</html>
