<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head th:replace="~{fragment/css :: css}">
</head>


<body>


<!-- Student Header -->
<div th:replace="~{fragment/student-header:: studentHeader}">
</div>



<div class="container-fluid">


    <div class="row">


        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">

         <div th:replace="~{fragment/student-sidebar :: studentSidebar}">
</div>
        </div>




        <!-- Content -->

        <div class="col-md-9 col-lg-10 p-4">


            <div class="card shadow">


                <div class="card-header bg-primary text-white">

                    <h5 class="mb-0">

                        <i class="bi bi-award"></i>

                        My Certificates

                    </h5>

                </div>



                <div class="card-body">


                    <div class="table-responsive">


                        <table class="table table-hover table-bordered">


                            <thead class="table-primary">


                            <tr>

                                <th>No</th>

                                <th>Course</th>

                                <th>Certificate No</th>

                                <th>Grade</th>

                                <th>Score</th>

                                <th>Issue Date</th>

                                <th>Action</th>

                            </tr>


                            </thead>




                            <tbody>


                            <tr th:each="certificate, stat : ${certificateList}">


                                <td th:text="${stat.count}">
                                </td>



                                <td th:text="${certificate.courseName}">
                                </td>



                                <td th:text="${certificate.certificateNumber}">
                                </td>



                                <td>

                                    <span class="badge bg-success"
                                          th:text="${certificate.letterGrade}">
                                    </span>

                                </td>



                                <td th:text="${certificate.finalScore}">
                                </td>



                                <td th:text="${certificate.issueDate}">
                                </td>



                               <td>

    <!-- View -->


    <!-- Download -->
    <a class="btn btn-success btn-sm"
       th:href="@{/student/certificate/download/{id}(id=${certificate.certificateID})}">

        <i class="bi bi-download"></i>
        Download

    </a>


</td>

                            </tr>




                            <tr th:if="${#lists.isEmpty(certificateList)}">


                                <td colspan="7"
                                    class="text-center text-muted">


                                    No Certificate Available


                                </td>


                            </tr>



                            </tbody>



                        </table>

<div th:each="certificate : ${certificateList}">


    <div class="modal fade"
         th:id="'certificateModal'+${certificate.certificateID}"
         tabindex="-1">


        <div class="modal-dialog modal-lg modal-dialog-centered">


            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Certificate Preview
                    </h5>


                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>



                <div class="modal-body text-center p-5">


                    <h1 class="fw-bold">
                        CERTIFICATE OF COMPLETION
                    </h1>


                    <p class="mt-4">
                        This certificate is proudly presented to
                    </p>



                    <h2 class="text-primary fw-bold"
                        th:text="${certificate.studentName}">
                    </h2>



                    <p>
                        For successfully completing
                    </p>



                    <h3 class="fw-bold"
                        th:text="${certificate.courseName}">
                    </h3>



                    <hr>


                    <div class="row">


                        <div class="col">

                            <b>Score</b>

                            <p th:text="${certificate.finalScore}">
                            </p>

                        </div>



                        <div class="col">

                            <b>Grade</b>

                            <p th:text="${certificate.letterGrade}">
                            </p>

                        </div>


                        <div class="col">

                            <b>Issue Date</b>

                            <p th:text="${certificate.issueDate}">
                            </p>

                        </div>


                    </div>


                    <p>

                        Certificate No :

                        <span th:text="${certificate.certificateNumber}">
                        </span>

                    </p>
                    <p>
    Issued By :

    <span class="fw-bold"
          th:text="${certificate.issuedByName}">
    </span>

</p>


                </div>


            </div>


        </div>


    </div>


</div>

                    </div>



                </div>


            </div>


        </div>



    </div>


</div>




<div th:replace="~{fragment/footer :: footer}">
</div>


<div th:replace="~{fragment/js :: js}">
</div>



</body>

</html>
