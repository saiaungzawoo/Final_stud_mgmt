<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Announcements</title>

    <!-- Base Fragments & Bootstrap -->
    <th:block th:replace="~{fragment/css :: css}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  
</head>

<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Header -->
    <div th:replace="~{fragment/student-header :: studentHeader}"></div>

    <!-- Main Wrapper (Sidebar + Page Content) -->
    <div class="d-flex flex-grow-1">
        
        <!-- SIDEBAR -->
        <div th:replace="~{fragment/student-sidebar :: studentSidebar}"></div>

        <!-- Main Content -->
        <main class="flex-grow-1 p-4">
            <div class="container-fluid">

                <!-- Page Heading -->
                <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
                    <h2 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-mega-phone-fill text-primary me-2"></i>Announcements
                    </h2>
                    <span class="badge bg-secondary rounded-pill fs-6 px-3 py-2" 
                          th:if="${not #lists.isEmpty(announcements)}" 
                          th:text="${#lists.size(announcements)} + ' Active'">
                        0 Active
                    </span>
                </div>

                <!-- Announcement List -->
                <div class="row g-3" th:if="${not #lists.isEmpty(announcements)}">
                    <div class="col-12" th:each="announcement : ${announcements}">
                        <div class="card shadow-sm announcement-card"
                             th:classappend="${#strings.containsIgnoreCase(announcement.priority, 'HIGH') or #strings.containsIgnoreCase(announcement.priority, 'URGENT') ? 'priority-high' : (#strings.containsIgnoreCase(announcement.priority, 'MEDIUM') ? 'priority-medium' : 'priority-low')}">
                            
                            <div class="card-body p-4">
                                
                                <!-- Title & Priority Badge -->
                                <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                                    <h4 class="card-title fw-bold text-dark mb-0" th:text="${announcement.title}">
                                        Announcement Title
                                    </h4>

                                    <span class="badge rounded-pill text-uppercase px-3 py-2"
                                          th:classappend="${#strings.containsIgnoreCase(announcement.priority, 'HIGH') or #strings.containsIgnoreCase(announcement.priority, 'URGENT') ? 'bg-danger-subtle text-danger border border-danger-subtle' : (#strings.containsIgnoreCase(announcement.priority, 'MEDIUM') ? 'bg-warning-subtle text-warning-emphasis border border-warning-subtle' : 'bg-info-subtle text-info-emphasis border border-info-subtle')}"
                                          th:text="${announcement.priority}">
                                        PRIORITY
                                    </span>
                                </div>

                                <!-- Date Metadata -->
                                <div class="text-muted small mb-3 d-flex align-items-center gap-1">
                                    <i class="bi bi-clock"></i>
                                    <span th:text="${#temporals.format(announcement.publishDate, 'dd MMM yyyy, HH:mm')}">
                                        01 Jan 2026, 10:00
                                    </span>
                                </div>

                                <!-- Content Preview -->
                                <p class="card-text text-secondary content-preview mb-3" th:text="${announcement.content}">
                                    Announcement text content goes here...
                                </p>

                                <!-- Action Button -->
                                <div class="d-flex justify-content-end">
                                    <a th:href="@{'/announcement/student/' + ${announcement.announcementID}}"
                                       class="btn btn-primary btn-sm rounded-2 px-3">
                                        Read More <i class="bi bi-arrow-right ms-1"></i>
                                    </a>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div th:if="${#lists.isEmpty(announcements)}" 
                     class="card shadow-sm border-0 text-center py-5 my-4">
                    <div class="card-body">
                        <div class="mb-3">
                            <i class="bi bi-inbox text-muted display-4"></i>
                        </div>
                        <h5 class="fw-bold text-dark">No Announcements Yet</h5>
                        <p class="text-muted mb-0">Check back later for news, events, and campus updates.</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Footer -->
    <th:block th:replace="~{fragment/footer :: footer}"></th:block>

    <!-- JavaScript Fragment -->
    <div th:replace="~{fragment/js :: js}"></div>

</body>
</html>
