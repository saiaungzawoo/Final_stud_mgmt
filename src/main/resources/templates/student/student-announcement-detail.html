<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Announcement Detail</title>

    <th:block th:replace="~{fragment/css :: css}">
    </th:block>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
</head>

<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Header -->
     <!-- Header -->
    <!-- STUDENT HEADER FRAGMENT -->
    <div th:replace="~{fragment/student-header :: studentHeader}"></div>




    <!-- Main Layout -->
    <div class="d-flex flex-grow-1">

        <!-- Student Sidebar -->
        <div th:replace="~{fragment/student-sidebar :: studentSidebar}">
        </div>


        <!-- Main Content -->
        <main class="flex-grow-1">

            <div class="container mt-5 mb-5">

                <div class="card shadow">

                    <div class="card-body">

                        <!-- Title -->
                        <h2 class="mb-3"
                            th:text="${announcement.title}">
                            Announcement Title
                        </h2>


                        <!-- Priority -->
                        <div class="mb-3">
                            <span class="badge bg-warning text-dark"
                                  th:text="${announcement.priority}">
                                Priority
                            </span>
                        </div>


                        <!-- Published Date -->
                        <p class="text-muted">

                            Published Date :

                            <span th:if="${announcement.publishDate != null}"
                                  th:text="${#temporals.format(announcement.publishDate, 'dd-MM-yyyy HH:mm')}">
                            </span>

                        </p>


                        <hr>


                        <!-- Content -->
                        <p class="fs-5"
                           style="white-space: pre-line;"
                           th:text="${announcement.content}">
                            Announcement Content
                        </p>


                        <hr>


                        <!-- Read Status -->
                        <div class="mb-3">

                            <span th:if="${isRead}"
                                  class="badge bg-primary">

                                <i class="bi bi-bookmark-check me-1"></i>

                                Read

                            </span>

                        </div>


                        <!-- Action Buttons -->
                        <div class="d-flex justify-content-end gap-2">

                            <!-- Read ဖြစ်ပြီး Acknowledge မလုပ်ရသေး -->
                            <div th:if="${isRead and !isAcknowledged}">

                                <form th:action="@{/announcement/student/{id}/acknowledge(id=${announcement.announcementID})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-success">

                                        <i class="bi bi-check-circle me-1"></i>

                                        Acknowledge

                                    </button>

                                </form>

                            </div>


                            <!-- Acknowledge လုပ်ပြီး -->
                            <div th:if="${isAcknowledged}">

                                <span class="btn btn-success">

                                    <i class="bi bi-check-circle-fill me-1"></i>

                                    Acknowledged

                                </span>

                            </div>


                            <!-- Back -->
                            <a th:href="@{/announcement/student}"
                               class="btn btn-secondary">

                                ← Back to Announcements

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>


    <!-- Footer -->
    <th:block th:replace="~{fragment/footer :: footer}">
    </th:block>

</body>

</html>
