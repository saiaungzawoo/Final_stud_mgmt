    <title>Submit Course Feedback</title>

    <th:block th:replace="~{fragment/css :: css}"></th:block>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Animation & Styles -->

        .rating{
    display:flex;
    flex-direction:row-reverse;
    justify-content:flex-end;
}

.rating input{
    display:none;
}

.rating label{
    font-size:38px;
    color:#ddd;
    cursor:pointer;
    transition:.2s;
    padding:0 2px;
}

/* Hover */
.rating label:hover,
.rating label:hover ~ label{
    color:#ffc107;
}

/* Selected */
.rating input:checked ~ label{
    color:#ffc107;
}
    </style>
</head>
<body class="bg-light">

    <!-- Student Header -->
    <div th:replace="~{fragment/student-header :: studentHeader}"></div>

    <div class="d-flex flex-column flex-lg-row min-vh-100">

        <!-- Student Sidebar -->
        <div th:replace="~{fragment/student-sidebar :: studentSidebar}"></div>

        <!-- Main Wrapper -->
        <div class="flex-grow-1 d-flex flex-column min-vh-100">

            <!-- Main Content -->
            <main class="container-fluid flex-grow-1 px-3 px-md-4 py-5 overflow-auto">
                <div class="row justify-content-center">
                    <div class="col-lg-8 col-xl-7">

                        <!-- Feedback Card Layout -->
                        <div class="card shadow-sm border-0 rounded-4 overflow-hidden feedback-card">
                            
                            <!-- Card Header -->
                            <div class="card-header bg-primary text-white text-center py-4 border-0">
                                <div class="mb-2">
                                    <i class="bi bi-chat-square-heart-fill animated-icon d-inline-block fs-1"></i>
                                </div>
                                <h3 class="mb-0 fw-bold">Course Feedback</h3>
                                <p class="text-white-50 small mb-0 mt-1">Share your thoughts and rate your experience for this course</p>
                            </div>

                            <!-- Card Body -->
                            <div class="card-body p-4 p-md-5 bg-white">
                                
                                <!-- Alert Error Message (e.g., Duplicate feedback error) -->
                                <div class="alert alert-danger d-flex align-items-center rounded-3 mb-4"
                                     th:if="${error}">
                                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                                    <span th:text="${error}">Error message placeholder</span>
                                </div>

                               <!-- No Course Message -->
<div th:if="${#lists.isEmpty(courses)}"
     class="text-center py-5">

    <i class="bi bi-journal-x display-1 text-secondary"></i>

    <h4 class="mt-3 fw-bold">
        You have no enrolled courses.
    </h4>

    <p class="text-muted">
        Please enroll in a course before submitting feedback.
    </p>

    <a th:href="@{#}"
       class="btn btn-primary rounded-pill px-4">
        <i class="bi bi-book me-1"></i>
        Browse Courses
    </a>

</div>

                                <form th:if="${!#lists.isEmpty(courses)}"
      th:action="@{/student/feedback/save}"
      th:object="${feedback}"
      method="post">

                                    <!-- Hidden Field for Course ID -->
                                    <!-- <input type="hidden" th:field="*{courseID}">

 -->
<div class="mb-4">
    <label class="form-label fw-semibold">
        <i class="bi bi-book-fill me-1 text-primary"></i>
        Course
    </label>

    <select class="form-select rounded-3 p-3"
            th:field="*{courseID}">

        <option value="">-- Select Course --</option>

        <option th:each="c : ${courses}"
                th:value="${c.courseID}"
                th:text="${c.feedbackGiven == 1 ?
                         c.courseName + ' (Already Feedback)' :
                         c.courseName}"
                th:disabled="${c.feedbackGiven == 1}">
        </option>

    </select>

    <div class="text-danger small mt-1"
         th:if="${#fields.hasErrors('courseID')}"
         th:errors="*{courseID}">
    </div>
</div>
                                   
<div class="mb-4">
    <label class="form-label fw-semibold">
        <i class="bi bi-star-fill text-warning"></i> Rating
    </label>

    <div class="rating">

        <input type="radio" id="star5" th:field="*{rating}" value="5">
        <label for="star5">&#9733;</label>

        <input type="radio" id="star4" th:field="*{rating}" value="4">
        <label for="star4">&#9733;</label>

        <input type="radio" id="star3" th:field="*{rating}" value="3">
        <label for="star3">&#9733;</label>

        <input type="radio" id="star2" th:field="*{rating}" value="2">
        <label for="star2">&#9733;</label>

        <input type="radio" id="star1" th:field="*{rating}" value="1">
        <label for="star1">&#9733;</label>

    </div>

    <div class="text-danger mt-2"
         th:if="${#fields.hasErrors('rating')}"
         th:errors="*{rating}">
    </div>
</div>

             
  <!--  <select class="form-select rounded-3 p-3 fs-6"
                                                th:field="*{rating}">
                                            <option value="">Select your rating...</option>
                                            <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
                                            <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
                                            <option value="3">⭐⭐⭐ (3 - Good)</option>
                                            <option value="2">⭐⭐ (2 - Fair)</option>
                                            <option value="1">⭐ (1 - Poor)</option>
                                        </select>

                                        <div class="text-danger small mt-1"
                                             th:if="${#fields.hasErrors('rating')}"
                                             th:errors="*{rating}">
                                        </div>
                                    </div> -->

                                    <!-- Comment Textarea -->
                                    <div class="mb-4">
                                        <label class="form-label fw-semibold text-dark mb-2">
                                            <i class="bi bi-pencil-square text-primary me-1"></i> Comment / Review
                                        </label>

                                        <textarea class="form-control rounded-3 p-3 fs-6"
                                                  rows="5"
                                                  th:field="*{comment}"
                                                  placeholder="Write your feedback details here..."></textarea>

                                        <div class="text-danger small mt-1"
                                             th:if="${#fields.hasErrors('comment')}"
                                             th:errors="*{comment}">
                                        </div>
                                    </div>

                                    <!-- Anonymous Checkbox -->
                                    <div class="mb-4">
                                        <div class="form-check form-switch p-3 bg-light rounded-3 d-flex align-items-center gap-2">
                                            <input class="form-check-input ms-0 me-2 fs-5"
                                                   type="checkbox"
                                                   role="switch"
                                                   id="isAnonymousCheck"
                                                   th:field="*{isAnonymous}" value="1" />
                                            <label class="form-check-label text-dark fw-medium" for="isAnonymousCheck">
                                                Submit feedback anonymously
                                            </label>
                                        </div>
                                    </div>

                                    <hr class="text-muted opacity-25 mb-4">

                                    <!-- Responsive Action Buttons -->
                                    <div class="d-flex flex-column-reverse flex-sm-row justify-content-between gap-2">
                                        <!-- Back Button -->
                                        <a th:href="@{#}"
                                           class="btn btn-outline-secondary px-4 py-2 rounded-pill hover-btn w-100 w-sm-auto text-center">
                                            <i class="bi bi-arrow-left me-1"></i> Cancel
                                        </a>

                                        <!-- Submit Button -->
                                        <button type="submit"
                                                class="btn btn-primary px-4 py-2 rounded-pill shadow-sm hover-btn w-100 w-sm-auto">
                                            Submit Feedback <i class="bi bi-send-fill ms-1"></i>
                                        </button>
                                    </div>

                                </form>
                            </div>

                        </div> <!-- /card -->

                    </div>
                </div>
            </main>

           
        </div>

    </div>
 <!-- Footer -->
            <div th:replace="~{fragment/footer :: footer}"></div>

    <!-- JS Scripts -->
    <div th:replace="~{fragment/js :: js}"></div>

</body>
</html>
